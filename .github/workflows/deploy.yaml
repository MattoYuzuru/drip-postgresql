name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle (cache, wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper works
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew || true

          echo "== gradle/wrapper directory =="
          ls -la gradle/wrapper || true

          # Если wrapper-jar отсутствует, попробуем сгенерировать его системным Gradle
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar is missing; generating wrapper via system Gradle"
            gradle wrapper --no-daemon
          fi

          # Если это текстовый файл (часто Git LFS pointer), то падать лучше с понятным сообщением
          if file gradle/wrapper/gradle-wrapper.jar | grep -qi 'text'; then
            echo "gradle-wrapper.jar looks like a text file (possibly a Git LFS pointer)."
            echo "If you use Git LFS, keep 'lfs: true' in checkout and commit the real jar."
            echo "First lines:"
            head -n 5 gradle/wrapper/gradle-wrapper.jar || true
            exit 1
          fi

          ./gradlew --version

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test
